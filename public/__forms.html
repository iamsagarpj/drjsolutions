<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>DRJ Solutions enquiry</title>
  </head>
  <body>
    <!-- Static form for Netlify build-time detection. The React app posts here. -->
    <form name="lead" method="POST" action="/__forms.html" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="lead" />
      <input name="bot-field" />
      <input name="name" />
      <input name="phone" />
      <input name="city" />
      <input name="monthlyBill" />
      <input name="propertyType" />
      <input name="message" />
      <input name="source" />
      <input name="language" />
    </form>
  </body>
</html>
